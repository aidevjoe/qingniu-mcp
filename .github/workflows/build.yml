name: build-and-push-to-ghcr

# 推送代码到 GitHub 后，自动在云端构建 linux/amd64 镜像并推送到 GHCR。
# 镜像地址固定为：ghcr.io/<你的GitHub用户名>/qingniu-mcp:latest
# 也可在 Actions 页面手动触发（workflow_dispatch）指定其它 tag。

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write   # 推送 GHCR 所需

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          echo "image=ghcr.io/${OWNER}/qingniu-mcp:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_sha=ghcr.io/${OWNER}/qingniu-mcp:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64   # 适配 x86_64 的 NAS
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image address
        run: |
          echo "镜像已推送："
          echo "  ${{ steps.meta.outputs.image }}"
          echo "在 NAS 的 .env 里设置 QN_IMAGE 为该地址，然后 docker compose pull && docker compose up -d"
